services:
  django:
    container_name: dabstar-wedsite
    image: django-docker:0.0.1
    build: .
    env_file:
      - .env
    ports:
      - 8001:8000
    command: sh -c "python dabstar_wedsite/manage.py migrate && python dabstar_wedsite/manage.py runserver 0.0.0.0:8000"
    volumes:
      - wedsite_data:/app/dabstar_wedsite/wedsite_data/

volumes:
    wedsite_data:
